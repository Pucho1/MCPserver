# -----------------------------------------------------------------------------
# Project identification
# -----------------------------------------------------------------------------

sonar.projectKey=sampling
sonar.projectName=Sampling MCP Server
sonar.projectVersion=0.1.0

# -----------------------------------------------------------------------------
# Source code
# -----------------------------------------------------------------------------

sonar.sources=config,core,middleware,prompts,resources,schemas,services,tools,server.py
sonar.tests=tests

# -----------------------------------------------------------------------------
# Python
# -----------------------------------------------------------------------------

sonar.python.version=3.10

# -----------------------------------------------------------------------------
# Reports
# -----------------------------------------------------------------------------

sonar.python.coverage.reportPaths=reports/coverage.xml
sonar.python.xunit.reportPath=reports/junit.xml

# -----------------------------------------------------------------------------
# Exclusions
# -----------------------------------------------------------------------------

sonar.exclusions=.venv/**,__pycache__/**

sonar.test.inclusions=tests/**