[project]
name = "sampling"
version = "0.1.0"
description = "Demonstration of sampling with MCP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastmcp>=3.3.1",
    "mcp>=1.9.3",
    "langfuse>=3.11.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools]
py-modules = ["server"]

[tool.setuptools.packages.find]
include = [
    "config*",
    "core*",
    "middleware*",
    "prompts*",
    "resources*",
    "schemas*",
    "services*",
    "tools*",
]


[tool.coverage.run]
branch = true
source = [
    "config",
    "core",
    "middleware",
    "prompts",
    "resources",
    "schemas",
    "services",
    "tools",
    "server"
]

omit = [
    "tests/*",
    ".venv/*"
]

[tool.coverage.xml]
output = "reports/coverage.xml"

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "reports/htmlcov"

[project.scripts]
mcp-server = "server:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
